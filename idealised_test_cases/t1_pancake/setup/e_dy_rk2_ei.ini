# 2026-11-16 EdS gas-only pancake (Tep et al. App. B): slopes=true level 4..6 update=HydroUpdate_RK2_ion  ; remap MapUserData_mean_eint (internal energy conserved on coarsening)
[ini]
convert_units = true
[amr]
bx = 4
by = 4
bz = 4
level_min = 4
level_max = 6
markers_kernel = RefineCondition_mass
remap = MapUserData_mean_eint
nboctspergroup = 1024
use_block_data = true
loadbalance_coherent_levels = 3
enable_load_balance_during_init = false
load_balancing_frequency = 1
[hydro]
gamma0 = 1.66666666666666666666
riemann = hllc
smallp = 1e-43
smallr = 1e-50
slope_enabled = true
slope_limiter = minmod
update = HydroUpdate_RK2_ion

[cosmology]
active = true
da = 1.01
mass_coarsen_factor = 0.1
mass_refine_factor = 1
lookup_size = 262144
omegab = 1.0
save_expansion_table = false
[dt]
dt_kernel = Compute_dt_cosmology,Compute_dt_hydro
dt = 1.0e-4
hydro_cfl = 0.8
[gravity]
solver = GravitySolver_multigrid
MG_eps = 1e-3
[particles]
update_position = none
update_density = none
[rad]
update = none
xe_start = 1.2e-3
c_rad = 0.01 speedoflight
[grafic]
inputDir = /lustre/orion/ast031/proj-shared/pocvirk/CoDaIII/prod_sr/pocvirk/dyablo/28102026/runs/pancake_eds/ic_64/
[mesh]
boundary_type_xmax = periodic
boundary_type_xmin = periodic
boundary_type_ymax = periodic
boundary_type_ymin = periodic
boundary_type_zmax = periodic
boundary_type_zmin = periodic
ndim = 3
xmin = 0
ymin = 0
zmin = 0
xmax = 95.522388059701493
ymax = 95.522388059701493
zmax = 95.522388059701493
[run]
enable_output = true
initial_conditions = grafic_fields
nstepmax = 1000000
t_end_var = aexp
tEnd = 1.0
output_frequency = 100000000
output_slice_var = aexp
output_timeslice = 0.083333333333333
checkpoint_frequency = 100000000
enable_checkpoint = false
nlog = 50
[output]
backend = IOManager_hdf5
checkpoint = IOManager_checkpoint
output_real_type = double
outputdir = /lustre/orion/ast031/proj-shared/pocvirk/CoDaIII/prod_sr/pocvirk/dyablo/28102026/runs/pancake_eds/e_dy_rk2_ei
outputprefix = e_dy_rk2_ei
write_mesh_info = yes
write_variables = rho,rho_vx,rho_vy,rho_vz,e_tot,level
[units]
time = 1 Myr
length = 1 Mpc
density = 1 kg / m3
particle_density = 1 atom/m3
