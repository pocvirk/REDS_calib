# z7_1e10_mE1_e0.03_n0.1_t3: z = 7 disc, M200 = 1e10 Msun, mech FB, eps 0.03, n_th 0.1 H/cc, t_SNII 3 Myr, M_SNII 10.0 Msun (E x1) -- make_inis.py
[units]
time = 1 Myr
length = 1 pc
mass = 1 solar_mass

[run]
initial_conditions = dice
tEnd = 300
nstepmax = 10000000
output_timeslice = 5
checkpoint_frequency = 2000
enable_checkpoint = true
nlog = 20

[dice]
file = /lustre/orion/ast031/proj-shared/pocvirk/CoDaIII/prod_sr/pocvirk/dyablo/28102026/runs/disc_z7/ICs/z7_1e10.h5
IG_density = 3e-6 solar_mass/pc**3
IG_T2 = 1e4 K

[amr]
bx = 4
by = 4
bz = 4
level_min = 4
level_max = 6
markers_kernel = RefineCondition_mass
mass_refine = 200000
mass_coarsen = 22222.2
nboctspergroup = 1024
use_block_data = true
loadbalance_coherent_levels = 3
load_balancing_frequency = 10

[mesh]
ndim = 3
xmin = 0
ymin = 0
zmin = 0
xmax = 50000
ymax = 50000
zmax = 50000
boundary_type_xmin = periodic
boundary_type_xmax = periodic
boundary_type_ymin = periodic
boundary_type_ymax = periodic
boundary_type_zmin = periodic
boundary_type_zmax = periodic

[hydro]
gamma0 = 1.6666666666666667
riemann = hllc
update = HydroUpdate_euler_ion
slope_enabled = true
slope_limiter = minmod
smallr = 1e-12
smallp = 1e-14

[dt]
dt_kernel = Compute_dt_hydro,Compute_dt_particle_velocity,Compute_dt_rad
hydro_cfl = 0.8
particle_cfl = 0.8

[gravity]
solver = GravitySolver_multigrid
MG_eps = 1e-3

[particles]
update_position = ParticleUpdate_CIC_move
update_density = ParticleUpdate_CIC_density
spawn = ParticleUpdate_star_formation
source_term = ParticleUpdate_NGP_src_bpass,ParticleUpdate_feedback_mechanical

[source_terms]
updates = SourceUpdate_Ionization_Chem_Ramses

[rad]
update = RadUpdate_euler_M1
rt_subcycling = true
rt_subcycling_dt_fraction = 1.0
c_rad = 0.01 speedoflight
temp_black_body = 50000 K
temperature = 1e4 K
small_erad = 1e-10
xe_start = 1.2e-3
subcycling_frac_change = 0.1
spawn_rate = 4e46 atom/s/solar_mass
t_life_star = 10 Myr
source_model = bpass
emissivity_file = /lustre/orion/ast031/proj-shared/pocvirk/CoDaIII/prod_sr/pocvirk/dyablo/28102026/dyablo_mg/settings/stellar_emissivity/cstSFR_5Myr_BPASSv2.2.1_kroupa_binary_MMax=100_emissivites_mags_betas.txt
emissivity_Z = 0.001
emissivity_tmax = 200 Myr

[star_formation]
density_threshold = 0.1 proton_mass/cm**3
mass_star = 1e4 solar_mass
temperature_threshold = 2e4 K
epsilon_star = 0.03

[star_feedback]
eta_SNII = 0.2
yield_SNII = 0.1
M_SNII = 10 solar_mass
E_SNII = 1e51 erg
t_SNII = 3 Myr

[output]
backend = IOManager_hdf5
checkpoint = IOManager_checkpoint
outputdir = /lustre/orion/ast031/proj-shared/pocvirk/CoDaIII/prod_sr/pocvirk/dyablo/28102026/runs/disc_z7/z7_1e10_mE1_e0.03_n0.1_t3
outputprefix = z7_1e10_mE1_e0.03_n0.1_t3
write_mesh_info = yes
write_variables = rho,rho_HII,rho_vx,rho_vy,rho_vz,e_tot,e_rad,fx_rad,fy_rad,fz_rad,src_ndot,level
write_particle_variables = particles/vx,particles/vy,particles/vz,particles/mass,particles/birth_time
