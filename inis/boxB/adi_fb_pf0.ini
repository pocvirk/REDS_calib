# 2026-11-17 ADIABATIC TWIN (user request): same ICs/hydro/refinement as eps0.01_rk2_ei_rr_cmp (production config:
# RK2_ion no switch, eint remap, mass_refine_ramses, smallp 1e-50) but no cooling/chemistry/RT/SF/feedback. DM + gas only, to z=6.
# Tests: halo T vs T_vir, halo baryon fraction, unshocked gas on the adiabat, entropy profiles; vs RAMSES ramses_box/adi_s1.
# VARIANT (negative-pressure fallback test, 2026-11-17): C: RAMSES pressure_fix with beta_fix = 0 (advected e_int + pdV through the step, used only where p < 0)
[ini]
convert_units = true

[amr]
bx = 4
by = 4
bz = 4
level_min = 6
level_max = 10
markers_kernel = RefineCondition_mass
remap = MapUserData_mean_eint
mass_refine_ramses = true
nboctspergroup = 1024
use_block_data = true
loadbalance_coherent_levels = 3
enable_load_balance_during_init = false
load_balancing_frequency = 1

[hydro]
beta_fix = 0.0
dual_energy_mode = ramses
gamma0 = 1.66666666666666666666
riemann = hllc
smallp = 1e-50
smallr = 1e-50
slope_enabled = true
slope_limiter = minmod
update = HydroUpdate_RK2_ion_pf

[cosmology]
active = true
da = 1.05
mass_coarsen_factor = 0.9
mass_refine_factor = 16
lookup_size = 262144
omegab = 0.049
save_expansion_table = false

[dt]
dt_kernel = Compute_dt_cosmology,Compute_dt_hydro,Compute_dt_particle_velocity
dt = 1.0e-4
particle_cfl = 0.8
hydro_cfl = 0.8

[gravity]
solver = GravitySolver_multigrid
MG_eps = 1e-3

[particles]
update_position = ParticleUpdate_CIC_move
update_density = ParticleUpdate_CIC_density

[rad]
update = none
xe_start = 1.2e-3
c_rad = 0.01 speedoflight

[grafic]
inputDir = /ccs/home/pocvirk/powork/dyablo/ics/boxB_4mpc_256/level_008/

[mesh]
boundary_type_xmax = periodic
boundary_type_xmin = periodic
boundary_type_ymax = periodic
boundary_type_ymin = periodic
boundary_type_zmax = periodic
boundary_type_zmin = periodic
ndim = 3
xmin = 0
ymin = 0
zmin = 0
xmax = 5.9603633880615234
ymax = 5.9603633880615234
zmax = 5.9603633880615234

[run]
enable_output = true
initial_conditions = grafic_fields,particle_grid
nstepmax = 1000000
t_end_var = aexp
tEnd = 0.14285714
output_frequency = 100000000
output_slice_var = aexp
output_timeslice = 0.01
checkpoint_frequency = 1000
enable_checkpoint = true
nlog = 50

[output]
backend = IOManager_hdf5
checkpoint = IOManager_checkpoint
output_real_type = double
outputdir = /lustre/orion/ast031/proj-shared/pocvirk/CoDaIII/prod_sr/pocvirk/dyablo/28102026/runs/reio_v2/adi_fb_pf0
outputprefix = adi_fb_pf0
write_mesh_info = yes
write_variables = rho,rho_HII,rho_vx,rho_vy,rho_vz,e_tot,level
write_particle_variables = particles/vx,particles/vy,particles/vz,particles/mass

[units]
time = 1 Myr
length = 1 Mpc
density = 1 kg / m3
particle_density = 1 atom/m3
