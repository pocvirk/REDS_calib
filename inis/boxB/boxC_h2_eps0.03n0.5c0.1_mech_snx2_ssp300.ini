# 2026-11-24 (PO, fiducial follow-ups): boxC_h2_eps0.03n0.5c0.1_mech_snx2_ssp300 = fiducial in the 8 Mpc/h box (boxC ICs, 512^3, levels 7-11:
#   same mass and spatial resolution). From ICs, build_avg, 8 nodes (64 GPUs, power of 8 for the MG solver).
# 2026-11-20: h2_eps0.03n0.5c0.1_mech_snx2_ssp300: weekend FB-strength campaign, series A (smooth SF, t10) (PO: try to recover the MEGATRON trend: strong FB -> low M* but high
#   f_esc -> higher x_HII(z); KB reds_feedback_sf.md 'Calibration levers'). = h2_eps0.03n0.5c0.1_mech_snx2 with 2x SN energy per Msun (M_SNII 5 Msun,
#   eta_SNII 0.2: 4e49 erg/Msun) and the SSP BPASS v2.2.1 binary Kroupa M_max = 300 table (REDS_src_files). build_avg (physics = build_h2),
#   [run] dump_averages = true. From ICs. Own 1-node chain (chain_avgone.sh).
# 2026-11-18: h2_eps0.03n0.5c0.1_mech_snx2 (PO: 'what if epsn0.03c0.1 and snx2'): h2_eps0.03_mech_snx2 + density-dependent SF efficiency eps = 0.03 (n/n_th)^0.5 capped at 0.1
#   (as h2_epsn0.03c0.1); i.e. sqrt(n) SF + mechanical FB + 2x SN; production hydro, build_h2 (REDS_hydro 7b0f0215); from ICs. Own 1-node chain (chain_h2one.sh).
# 2026-11-17 (parent h2_eps0.03_mech_snx2): cf_eps0.03_mech_snx2 with the validated production hydro (KB hydro_recipe_cosmo.md, hydro_regression/):
#   RK2 + minmod (was 1st order: slope_enabled = false, Euler), MapUserData_mean_eint, mass_refine_ramses, smallp 1e-50,
#   [rad] compton, negative_p_fallback = adiabat; build_h2 (REDS_hydro 7b0f0215); from ICs.
# 2026-11-14: cf_eps0.03_mech_snx2: eps0.03_mech_snx2 (mech FB, M_SNII 5 Msun = 2x SN energy per Msun); build_chemfix (dyablo 274dc558, fixed Chem_Ramses), from ICs. FB bracket after the chemistry fix (PO).
# reio_v2/eps0.03_mech_snx2 (2026-11-13, PO): eps0.03_mech with SN feedback boosted 2x (M_SNII 10 -> 5 Msun: 0.04 SN/Msun, as SPHINX ~4x Kroupa); from ICs.
# 2026-11-12 (2): redone from ICs with mass_star = 1e4 solar_mass (runs without it in old_nomassstar/)
# 2026-11-12: redone from ICs with dyablo 83f1442c (SF gas overdensity threshold Delta*Omega_b*rho_c; was Omega_m, runs in old_omegam/)
# reio_v2/eps0.03_mech (2026-11-12, PO): eps0.03 with mechanical SN feedback (Kimm & Cen 2014), otherwise identical; from ICs.
# Original eps0.03 header (2026-11-09): reio_boxB_bpass.ini rerun with REDS 4c9d0330 (rho_HII advected: HydroUpdate_euler_ion,
#   SourceUpdate_Ionization_Chem_Ramses, BPASS) + [rad] rt_subcycling (f = 0.25), c_rad = 0.01c (was 0.1c, 65x slower than the 0.001c run: 200-350 RT subcycles per step; before that 0.001c); epsilon_star = 0.03 (user: SF efficiency +100/200%).
# reio_boxB_bpass: reio_boxB (see reio_boxB.ini header) with BPASS stellar emission (dyablo branch REDS, 2026-11-03):
#   [rad] source_model = bpass, CoDa III table cstSFR 5 Myr BPASS v2.2.1, Z = 0.001 (Zsun/20), emission to 200 Myr.
#   Run from the ICs to z=5 (aexp 1/6); snapshots every 0.005 in aexp with RT fluxes (dashboard fesc) and src_ndot.
# reio_boxB: reconstruction of the willow production run dyablo_runs/out_4_256_lvl_6_10..._zreion
# (4 Mpc/h, 256^3, levels 6-10) for dyablo cosmo_reio_mg_H_He@46c74bef on Frontier GPU.
# Sources of each setting:
#  - slide "Modelisation physique dans Dyablo" (Nathan, fesc talk): SF thresholds (delta>200, n>0.1 H/cc, T<2e4 K),
#    4e46 photons/s/Msun, thermal SN feedback 1e51 erg per 10 Msun progenitor, 20% of new star mass goes SN, M1 RT
#  - KB cosmo_dm_runs.md: zreion run used mass_refine_factor=16, slope_enabled=false + minmod, smallp=1e-25, smallr=1e-50
#  - dyablo settings/cosmo/star_cosmo_rt_feedback.ini (template): everything else
#  - user choices 2026-11-02: c_rad=0.001c, epsilon_star=0.01, t_life_star=10 Myr, boxB_4mpc_256 ICs
#  - changed vs template: CG -> new multigrid; save_expansion_table=false (O(ranks) Lustre contention)
# ICs have no ic_velb*: the reader falls back to the DM velocities (warning in the log).
# H0 is left out on purpose: it is set from the grafic header in code units.
[ini]
convert_units = true

[amr]
remap = MapUserData_mean_eint
mass_refine_ramses = true
bx = 4
by = 4
bz = 4
level_min = 7
level_max = 11
markers_kernel = RefineCondition_mass
nboctspergroup = 1024
use_block_data = true
loadbalance_coherent_levels = 3
enable_load_balance_during_init = false
load_balancing_frequency = 1

[hydro]
gamma0 = 1.66666666666666666666
riemann = hllc
# smallp is in CODE units: the KB value 1e-25 was for the ladder inis (m, s); with Mpc/Myr units the same
# physical floor is 1e-25 / (Mpc/Myr in m/s)^2 = 1e-25 / 9.56e17 ~ 1e-43 (1e-25 here made cs ~ 20 Mpc/Myr, dt_hydro ~ 2e-4 Myr)
smallp = 1e-50
smallr = 1e-50
slope_enabled = true
slope_limiter = minmod
update = HydroUpdate_RK2_ion
negative_p_fallback = adiabat

[cosmology]
active = true
da = 1.05
mass_coarsen_factor = 0.9
mass_refine_factor = 16
lookup_size = 262144
omegab = 0.049
# true makes every rank rewrite expansion_table.dat 3x at init: O(ranks) Lustre lock contention
save_expansion_table = false

[dt]
dt_kernel = Compute_dt_cosmology,Compute_dt_hydro,Compute_dt_particle_velocity,Compute_dt_rad
dt = 1.0e-4
particle_cfl = 0.8
hydro_cfl = 0.8

[gravity]
solver = GravitySolver_multigrid
MG_eps = 1e-3

[particles]
update_position = ParticleUpdate_CIC_move
update_density = ParticleUpdate_CIC_density
spawn = ParticleUpdate_star_formation
source_term = ParticleUpdate_NGP_src_bpass,ParticleUpdate_feedback_mechanical

[source_terms]
updates = SourceUpdate_Ionization_Chem_Ramses

[rad]
compton = true
update = RadUpdate_euler_M1
temp_black_body = 50000 K
temperature = 1e4 K
small_erad = 1e-10
xe_start = 1.2e-3
subcycling_frac_change = 0.1
c_rad = 0.01 speedoflight
rt_subcycling = true
spawn_rate = 4e46 atom/s/solar_mass
t_life_star = 10 Myr
source_model = bpass
emissivity_file = /lustre/orion/ast031/proj-shared/pocvirk/CoDaIII/prod_sr/pocvirk/dyablo/28102026/REDS_src_files/SSP_BPASSv2.2.1_kroupa_binary_MMax300_pseudo-f1_pf_width200Angstrom_emissivites_mags_betas.txt
emissivity_Z = 0.001
emissivity_tmax = 200 Myr

[star_formation]
density_threshold = 0.1 proton_mass/cm**3
# 2026-11-12: elementary star particle mass (was default rho_threshold*dx_min^3 ~3.6e3 Msun)
mass_star = 1e4 solar_mass
temperature_threshold = 2e4 K
epsilon_star = 0.03
epsilon_star_density_slope = 0.5
epsilon_star_max = 0.1
mean_overdensity_threshold = 200.0

[star_feedback]
eta_SNII = 0.2
yield_SNII = 0.1
# 2x SN number per unit stellar mass (0.04/Msun = 4e49 erg/Msun), same ejected mass fraction eta_SNII
M_SNII = 5 solarmass
E_SNII = 1e51 erg
t_SNII = 10 Myr

[grafic]
inputDir = /ccs/home/pocvirk/powork/dyablo/ics/boxC_8mpc_512/level_009/

[mesh]
boundary_type_xmax = periodic
boundary_type_xmin = periodic
boundary_type_ymax = periodic
boundary_type_ymin = periodic
boundary_type_zmax = periodic
boundary_type_zmin = periodic
ndim = 3
xmin = 0
ymin = 0
zmin = 0
# box size in code units (Mpc), must match the grafic header (11.92 Mpc = 8 Mpc/h)
xmax = 11.920726776123047
ymax = 11.920726776123047
zmax = 11.920726776123047

[run]
dump_averages = true
enable_output = true
initial_conditions = grafic_fields,particle_grid
nstepmax = 1000000
t_end_var = aexp
tEnd = 0.16666667
output_frequency = 100000000
output_slice_var = aexp
output_timeslice = 0.005
checkpoint_frequency = 1000
enable_checkpoint = true
nlog = 50

[output]
backend = IOManager_hdf5
checkpoint = IOManager_checkpoint
output_real_type = double
outputdir = /lustre/orion/ast031/proj-shared/pocvirk/CoDaIII/prod_sr/pocvirk/dyablo/28102026/runs/reio_v2/boxC_h2_eps0.03n0.5c0.1_mech_snx2_ssp300
outputprefix = boxC_h2_eps0.03n0.5c0.1_mech_snx2_ssp300
write_mesh_info = yes
write_variables = rho,rho_HII,rho_vx,rho_vy,rho_vz,e_tot,e_rad,fx_rad,fy_rad,fz_rad,src,src_ndot,zreion,level
write_particle_variables = particles/vx,particles/vy,particles/vz,particles/mass,particles/birth_time

[units]
time = 1 Myr
length = 1 Mpc
density = 1 kg / m3
particle_density = 1 atom/m3
